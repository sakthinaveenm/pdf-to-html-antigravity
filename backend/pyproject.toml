[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multilingual-pdf-to-html"
version = "1.0.0"
description = "Local-First Multilingual PDF to Semantic HTML Conversion Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Engineering Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.0",
    "python-multipart>=0.0.12",
    "aiofiles>=24.1.0",
    "pymupdf>=1.24.10",
    "pdfplumber>=0.11.4",
    "pypdf>=5.0.0",
    "pytesseract>=0.3.13",
    "pillow>=10.4.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "nh3>=0.2.18",
    "psutil>=6.0.0",
    "markdown2>=2.5.0",
    "docling>=2.147.0",
    "marker-pdf>=2.1.0",
    "arabic-reshaper>=3.1.0",
    "python-bidi>=0.6.12"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0"
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
